[package]
name = "quad-engine-core"
version = "0.1.0"
edition = "2021"

[lib]
name = "quad_engine_core"
path = "src/lib.rs"

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = { version = "0.36", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
